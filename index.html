        <h1>Selfix · Year in Pixels Journal</h1>
        <p>
          Selfix is a soft pastel space for your days, thoughts, and memories. It is a visual Year in
          Pixels journal — not a cold spreadsheet — for gently tracking how life feels over a year.
        </p>
        <h2>Core features</h2>
        <ul>
          <li><strong>Year in Pixels</strong> — paint each day as a soft pastel square and watch your year become a readable mosaic.</li>
          <li><strong>Sleep tracking</strong> — log rest and overnight patterns with calm, visual clarity.</li>
          <li><strong>Mood tracking</strong> — note how days felt with gentle color levels and optional chips.</li>
          <li><strong>Habit tracking</strong> — follow hydration, focus, workouts, reading, and other daily rhythms.</li>
          <li><strong>Daily notes</strong> — keep private per-day reflections beside each tracker.</li>
        </ul>
