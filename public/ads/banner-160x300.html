    <script>
      // Tell parent if Adsterra never injected a creative (no-fill). Policy-safe.
      ;(function notifyFillState() {
        function hasCreative() {
          return !!(
            document.querySelector('iframe') ||
            document.querySelector('img') ||
            document.querySelector('ins') ||
            document.querySelector('a[href]')
          )
        }
        function send(filled) {
          try {
            parent.postMessage(
              { source: 'adsterra-display-160x300', filled: !!filled },
              window.location.origin,
            )
          } catch (_) {
            /* ignore */
          }
        }
        // Adsterra usually injects quickly; re-check a few times for slow fill.
        var checks = [1200, 2500, 4500]
        checks.forEach(function (ms, i) {
          setTimeout(function () {
            var filled = hasCreative()
            if (filled || i === checks.length - 1) send(filled)
          }, ms)
        })
      })()
    </script>
